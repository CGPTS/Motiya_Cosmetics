<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetMap Teva | מערכת מיפוי רשת</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-brand">
            <i class="fas fa-network-wired brand-icon"></i>
            <h1 class="brand-text">NetMap <span>Teva</span></h1>
        </div>
        <div class="topbar-search">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="search-input" placeholder="חיפוש לפי שם, IP, דגם...">
        </div>
        <div class="topbar-actions">
            <button id="add-site-btn" class="btn-primary"><i class="fas fa-plus"></i><span class="btn-label"> אתר חדש</span></button>
            <button id="logout-btn" class="btn-ghost" title="התנתק"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </header>

    <main class="main-content">
        <section class="stats-section" id="stats-section"></section>

        <section class="content-section">
            <div class="section-header">
                <h2><i class="fas fa-sitemap"></i> מבנה הרשת</h2>
                <div class="section-actions">
                    <button id="collapse-all-btn" class="btn-ghost btn-sm" title="כווץ הכל"><i class="fas fa-compress-alt"></i></button>
                    <button id="expand-all-btn" class="btn-ghost btn-sm" title="הרחב הכל"><i class="fas fa-expand-alt"></i></button>
                </div>
            </div>
            <div id="hierarchy-container" class="tree-view">
                <div class="loading-state">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>טוען נתונים...</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Form Modal -->
    <div id="form-modal" class="modal hidden">
        <div class="modal-overlay"></div>
        <div class="modal-dialog glass-panel">
            <div class="modal-header">
                <h3 id="modal-title">כותרת</h3>
                <button class="modal-close"><i class="fas fa-times"></i></button>
            </div>
            <form id="dynamic-form">
                <div id="form-fields" class="modal-body"></div>
                <div class="modal-footer">
                    <button type="submit" class="btn-primary"><i class="fas fa-check"></i> שמור</button>
                    <button type="button" class="btn-secondary modal-cancel">ביטול</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div id="confirm-modal" class="modal hidden">
        <div class="modal-overlay"></div>
        <div class="modal-dialog glass-panel modal-sm">
            <div class="modal-header">
                <h3 id="confirm-title">אישור מחיקה</h3>
                <button class="modal-close"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="confirm-icon"><i class="fas fa-exclamation-triangle"></i></div>
                <p id="confirm-message" class="confirm-text"></p>
            </div>
            <div class="modal-footer">
                <button id="confirm-yes" class="btn-danger"><i class="fas fa-trash"></i> מחק</button>
                <button id="confirm-no" class="btn-secondary">ביטול</button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
